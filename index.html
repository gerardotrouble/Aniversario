<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2b1520">
<title>Tres años contigo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="app">
  <div class="tools">
    <button class="tool" id="themeBtn" type="button" aria-label="Cambiar entre tema claro y oscuro" title="Tema">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button class="tool" id="restartBtn" type="button" aria-label="Volver a la portada" title="Volver a la portada">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
  </div>

  <main class="stage">
    <div class="shift" id="shift" data-pos="start">
      <div class="book" id="book" role="region" aria-roledescription="libro" aria-label="Libro de nuestro aniversario de tres años">
        <div class="board l"></div>
        <div class="board r"></div>
        <div class="endboard" id="endboard"></div>
      </div>
    </div>
  </main>

  <nav class="controls" aria-label="Navegación del libro">
    <button class="nav" id="prev" type="button" aria-label="Página anterior">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="mid">
      <p class="label" id="label" aria-live="polite"></p>
      <div class="dots" id="dots"></div>
    </div>
    <button class="nav" id="next" type="button" aria-label="Página siguiente">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </nav>
</div>

<noscript>Este libro necesita JavaScript para abrirse. Actívalo y vuelve a intentarlo.</noscript>

<script src="js/app.js" defer></script>
</body>
</html>
